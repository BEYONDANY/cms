name = "beyondany-cms"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发时用 vars；生产请在 Dashboard / wrangler secret 设置 AUTH_SECRET
# 费用策略：保持 Workers Free（勿升 Paid）；勿加 Cron/Logpush/[limits]；R2 勿开公网域名
# 详见 docs/zero-cost.md
[vars]
SITE_NAME = "BeyondAny"
SITE_URL = "https://beyondany.com"
# Turnstile 站点钥（公开）；密钥用：npx wrangler secret put TURNSTILE_SECRET_KEY
TURNSTILE_SITE_KEY = "0x4AAAAAAFJ9BeUGGdWAObnt"
# 用量看板（Token 用 secret：npx wrangler secret put CF_API_TOKEN）
CF_ACCOUNT_ID = "ba8dfe72787ba341a3047b8249268878"
CF_WORKER_NAME = "beyondany-cms"
CF_D1_DATABASE_ID = "d6471bb1-479d-40de-b7a1-911e0fc3829c"

[[d1_databases]]
binding = "DB"
database_name = "cms-db"
database_id = "d6471bb1-479d-40de-b7a1-911e0fc3829c"
preview_database_id = "d6471bb1-479d-40de-b7a1-911e0fc3829c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cms-media"
preview_bucket_name = "cms-media"

[[r2_buckets]]
binding = "SITE"
bucket_name = "cms-site"
preview_bucket_name = "cms-site"

[assets]
directory = "public"
binding = "ASSETS"

[[routes]]
pattern = "beyondany.com"
custom_domain = true

[[routes]]
pattern = "www.beyondany.com"
custom_domain = true
