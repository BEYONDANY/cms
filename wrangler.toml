name = "beyondany-cms"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发时用 vars；生产请在 Dashboard / wrangler secret 设置 AUTH_SECRET
[vars]
SITE_NAME = "BeyondAny Blog"
SITE_URL = "https://beyondany.com"

[[d1_databases]]
binding = "DB"
database_name = "cms-db"
database_id = "local-dev-placeholder"
preview_database_id = "local-dev-placeholder"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cms-media"
preview_bucket_name = "cms-media"

[assets]
directory = "public"
binding = "ASSETS"
